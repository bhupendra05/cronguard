[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cronguard"
version = "0.1.0"
description = "Monitor cron jobs for missed runs — get alerted before users notice"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["cron", "monitoring", "scheduler", "devops", "alerting", "jobs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
cronguard = "cronguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cronguard*"]
